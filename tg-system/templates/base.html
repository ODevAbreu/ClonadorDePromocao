<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tg-system · {% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Define o tema antes de pintar, para não piscar.
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <style>
    :root {
      --bg:#FAFAF7; --surface:#FFFFFF; --surface-2:#F4F2EC;
      --ink:#141413; --muted:#6B6A63; --border:#E6E3DA; --border-strong:#D6D2C6;
      --accent:#D97757; --accent-strong:#BD5D3A; --accent-soft:#F6E7DF; --on-accent:#FFFFFF;
      --ok:#3F7D53; --ok-soft:#E4EEE4;
      --danger:#B4452F; --danger-soft:#F4E0DB;
      --shadow:0 1px 2px rgba(20,20,19,.04), 0 1px 3px rgba(20,20,19,.03);
      --radius:12px; --radius-sm:8px;
      --sans:"Hanken Grotesk",system-ui,sans-serif;
      --serif:"Newsreader",Georgia,serif;
    }
    :root[data-theme="dark"] {
      --bg:#1A1917; --surface:#262522; --surface-2:#211F1D;
      --ink:#ECE9E0; --muted:#A3A097; --border:#37352F; --border-strong:#47443D;
      --accent:#D97757; --accent-strong:#E08B6E; --accent-soft:#3A2A22; --on-accent:#1A1917;
      --ok:#7FB58C; --ok-soft:#24302A;
      --danger:#E08873; --danger-soft:#3A2420;
      --shadow:0 1px 2px rgba(0,0,0,.3);
    }

    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font-family:var(--sans); font-size:16px; line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    a { color:var(--accent-strong); text-decoration:none; }
    a:hover { text-decoration:underline; }

    /* ---- top bar ---- */
    .topbar {
      position:sticky; top:0; z-index:10;
      background:color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter:saturate(1.2) blur(8px);
      border-bottom:1px solid var(--border);
    }
    .topbar-inner {
      max-width:980px; margin:0 auto; padding:0 24px;
      height:64px; display:flex; align-items:center; gap:28px;
    }
    .brand {
      font-family:var(--serif); font-size:23px; font-weight:500; letter-spacing:-.01em;
      color:var(--ink); display:flex; align-items:center; gap:9px;
    }
    .brand:hover { text-decoration:none; }
    .brand .dot { width:11px; height:11px; border-radius:50%; background:var(--accent);
                  display:inline-block; }
    nav.main { display:flex; gap:4px; margin-left:4px; flex:1; }
    nav.main a {
      color:var(--muted); font-size:15px; font-weight:500;
      padding:7px 12px; border-radius:var(--radius-sm); line-height:1;
    }
    nav.main a:hover { color:var(--ink); background:var(--surface-2); text-decoration:none; }
    nav.main a.active { color:var(--ink); background:var(--surface-2); }

    .theme-toggle {
      width:38px; height:38px; display:grid; place-items:center;
      background:transparent; border:1px solid var(--border); border-radius:var(--radius-sm);
      color:var(--muted); cursor:pointer; transition:color .15s, border-color .15s;
    }
    .theme-toggle:hover { color:var(--ink); border-color:var(--border-strong); }
    .theme-toggle svg { width:18px; height:18px; }
    :root[data-theme="dark"] .theme-toggle .i-moon { display:none; }
    :root[data-theme="light"] .theme-toggle .i-sun { display:none; }

    /* ---- layout ---- */
    main { max-width:980px; margin:0 auto; padding:40px 24px 80px; }

    .page-head { margin-bottom:28px; }
    h1 { font-family:var(--serif); font-weight:500; font-size:34px; line-height:1.12;
         letter-spacing:-.015em; margin:0 0 6px; }
    .lede { color:var(--muted); font-size:16px; max-width:62ch; margin:0; }
    h2 { font-family:var(--serif); font-weight:500; font-size:21px; letter-spacing:-.01em;
         margin:0 0 14px; }

    .card {
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      padding:22px 24px; margin-bottom:20px; box-shadow:var(--shadow);
    }

    /* ---- forms ---- */
    label { display:block; color:var(--ink); font-size:14px; font-weight:500;
            margin:16px 0 6px; }
    label.inline-check { display:flex; align-items:center; gap:9px; font-weight:400;
            color:var(--ink); margin:8px 0; }
    input, select, textarea {
      width:100%; padding:10px 12px; font:inherit; color:var(--ink);
      background:var(--surface); border:1px solid var(--border-strong);
      border-radius:var(--radius-sm); transition:border-color .15s, box-shadow .15s;
    }
    input::placeholder, textarea::placeholder { color:var(--muted); opacity:.7; }
    input:focus, select:focus, textarea:focus {
      outline:none; border-color:var(--accent);
      box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    input[type="checkbox"] { width:auto; accent-color:var(--accent); }
    textarea { min-height:68px; resize:vertical; }
    .hint { color:var(--muted); font-size:13px; margin:6px 0 0; }

    /* ---- buttons ---- */
    button, .btn {
      font:inherit; font-weight:600; font-size:14.5px; cursor:pointer;
      padding:9px 16px; border-radius:var(--radius-sm); border:1px solid transparent;
      background:var(--accent-strong); color:var(--on-accent);
      display:inline-flex; align-items:center; gap:7px; line-height:1.1;
      transition:background .15s, border-color .15s, color .15s;
    }
    button:hover, .btn:hover { background:var(--accent); text-decoration:none; }
    .btn.ghost, button.ghost {
      background:transparent; border-color:var(--border-strong); color:var(--ink);
    }
    .btn.ghost:hover, button.ghost:hover { background:var(--surface-2); }
    button.danger { background:transparent; border-color:var(--border-strong); color:var(--danger); }
    button.danger:hover { background:var(--danger-soft); border-color:var(--danger); }

    /* ---- table ---- */
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:13px 10px; border-bottom:1px solid var(--border);
             vertical-align:middle; }
    th { color:var(--muted); font-size:12.5px; font-weight:600; letter-spacing:.01em; }
    tr:last-child td { border-bottom:0; }
    td.muted, .muted { color:var(--muted); }
    td .muted { font-size:14px; }

    /* ---- pills ---- */
    .pill { font-size:12.5px; font-weight:600; padding:3px 11px; border-radius:999px;
            display:inline-flex; align-items:center; gap:6px; }
    .pill::before { content:""; width:6px; height:6px; border-radius:50%;
                    background:currentColor; }
    .pill.on { background:var(--ok-soft); color:var(--ok); }
    .pill.off { background:var(--danger-soft); color:var(--danger); }

    /* ---- integration picker (cartões) ---- */
    .pick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
                 gap:12px; margin:8px 0 6px; }
    .pick { position:relative; cursor:pointer; display:block; }
    .pick input { position:absolute; opacity:0; pointer-events:none; }
    .pick-inner {
      display:flex; flex-direction:column; gap:11px; height:100%;
      padding:16px; border:1px solid var(--border-strong); border-radius:var(--radius);
      background:var(--surface); transition:border-color .15s, box-shadow .15s, background .15s;
    }
    .pick:hover .pick-inner { border-color:var(--accent); }
    .pick input:checked + .pick-inner {
      border-color:var(--accent);
      box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .pick .badge { width:40px; height:40px; border-radius:11px; display:grid;
                   place-items:center; color:#fff; flex:none; }
    .pick .badge svg { width:22px; height:22px; }
    .pick .logo-plate { height:54px; border-radius:9px; background:#fff;
                        border:1px solid var(--border); display:grid; place-items:center;
                        padding:10px 14px; }
    .pick .logo-plate img { max-height:30px; max-width:100%; width:auto; object-fit:contain; }
    .pick .logo-plate.accent { background:var(--accent-strong); border-color:transparent; }
    .pick .logo-plate.accent svg { width:26px; height:26px; color:#fff; }
    .list-logo { height:18px; width:auto; vertical-align:middle; }
    .pick-name { font-weight:600; font-size:15px; }
    .pick-desc { color:var(--muted); font-size:12.5px; line-height:1.35; }

    /* ---- contador de repasses + ações ---- */
    .count-chip {
      display:inline-flex; align-items:baseline; gap:5px;
      background:var(--surface-2); border:1px solid var(--border);
      padding:4px 11px; border-radius:999px;
    }
    .count-chip b { font-size:15px; font-variant-numeric:tabular-nums; color:var(--ink); }
    .count-chip span { font-size:12px; color:var(--muted); }
    .actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .actions button, .actions .btn { padding:7px 11px; font-size:13.5px; }
    .actions .icon-btn { padding:7px 9px; }
    .actions svg { width:15px; height:15px; }

    /* ---- utils ---- */
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .between { justify-content:space-between; }
    .inline { display:inline; }
    code { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.88em;
           background:var(--surface-2); padding:1px 6px; border-radius:5px; }

    @media (max-width:640px) {
      .topbar-inner { gap:14px; padding:0 16px; }
      nav.main { gap:0; }
      nav.main a { padding:7px 9px; font-size:14px; }
      .brand span.word { display:none; }
      main { padding:28px 16px 64px; }
      h1 { font-size:28px; }
    }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><span class="dot"></span><span class="word">tg-system</span></a>
      <nav class="main">
        <a href="/">Forward</a>
        <a href="/clone">Clone</a>
        <a href="/whatsapp">WhatsApp</a>
        <a href="/accounts">Contas</a>
        <a href="/integrations">Integrações</a>
        <a href="/settings">Configurações</a>
      </nav>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema claro/escuro" title="Alternar tema">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <main>{% block body %}{% endblock %}</main>

  <script>
    function toggleTheme() {
      var cur = document.documentElement.getAttribute("data-theme");
      var next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    }
    // marca o link de navegação ativo
    (function () {
      var path = location.pathname;
      document.querySelectorAll("nav.main a").forEach(function (a) {
        var href = a.getAttribute("href");
        if (href === path || (href !== "/" && path.indexOf(href) === 0)) a.classList.add("active");
      });
    })();
  </script>
</body>
</html>
